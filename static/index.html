<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Atlas</title>
<link rel="manifest" href="/static/manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* --- Cervello 3D --- */
  #brain-container {
    flex: 1;
    position: relative;
    min-height: 200px;
  }
  #brain-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* --- Status bar --- */
  #status-bar {
    text-align: center;
    padding: 6px 16px;
    font-size: 13px;
    color: #888;
    background: rgba(10,10,15,0.9);
    min-height: 28px;
  }
  #status-bar.thinking { color: #4fc3f7; }
  #status-bar.speaking { color: #81c784; }
  #status-bar.recording { color: #ef5350; }

  /* --- Chat area --- */
  #chat-area {
    max-height: 35dvh;
    overflow-y: auto;
    padding: 8px 16px;
    background: rgba(15,15,20,0.95);
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  .msg {
    margin: 6px 0;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 85%;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    background: #1a3a5c;
    color: #ddd;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    background: #1e1e2e;
    color: #ccc;
    border-bottom-left-radius: 4px;
  }

  /* --- Barra input --- */
  #input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #111118;
    border-top: 1px solid #222;
  }
  #input-bar input {
    flex: 1;
    background: #1a1a24;
    border: 1px solid #333;
    border-radius: 24px;
    padding: 10px 16px;
    color: #e0e0e0;
    font-size: 15px;
    outline: none;
  }
  #input-bar input:focus { border-color: #4fc3f7; }
  #input-bar input::placeholder { color: #555; }

  .btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  #btn-send {
    background: #2196f3;
    color: white;
  }
  #btn-send:active { background: #1976d2; }

  #btn-mic {
    background: #333;
    color: #ccc;
    position: relative;
  }
  #btn-mic.recording {
    background: #c62828;
    color: white;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(198,40,40,0.5); }
    50% { box-shadow: 0 0 0 12px rgba(198,40,40,0); }
  }
  #btn-mic svg, #btn-send svg { width: 22px; height: 22px; }

  /* Safe area per iPhone */
  #input-bar { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>

<div id="brain-container">
  <canvas id="brain-canvas"></canvas>
</div>

<div id="status-bar">Connessione...</div>

<div id="chat-area"></div>

<div id="input-bar">
  <button id="btn-mic" class="btn" title="Tieni premuto per parlare">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
  </button>
  <input type="text" id="input-text" placeholder="Scrivi un messaggio..." autocomplete="off">
  <button id="btn-send" class="btn" title="Invia">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<!-- Three.js r128 per il cervello 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ======================================================================
// CERVELLO 3D (Three.js) — versione semplificata per mobile
// ======================================================================
const canvas = document.getElementById('brain-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
camera.position.set(0, 0, 3.5);

// Luci
scene.add(new THREE.AmbientLight(0x334455, 0.5));
const pointLight = new THREE.PointLight(0x4fc3f7, 1.5, 10);
pointLight.position.set(2, 2, 3);
scene.add(pointLight);

// Cervello: sfera con vertex displacement
const brainGeo = new THREE.IcosahedronGeometry(1.2, 5);
const brainMat = new THREE.MeshPhongMaterial({
  color: 0x1a2744,
  emissive: 0x0d1b2a,
  shininess: 40,
  wireframe: false,
  transparent: true,
  opacity: 0.85,
});
const brain = new THREE.Mesh(brainGeo, brainMat);
scene.add(brain);

// Glow wireframe
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x4fc3f7,
  wireframe: true,
  transparent: true,
  opacity: 0.08,
});
const wireframe = new THREE.Mesh(new THREE.IcosahedronGeometry(1.22, 4), wireMat);
scene.add(wireframe);

// Particelle (sinapsi)
const PARTICLE_COUNT = 120;
const pGeo = new THREE.BufferGeometry();
const pPositions = new Float32Array(PARTICLE_COUNT * 3);
const pVelocities = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 1.3 + Math.random() * 0.4;
  pPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  pPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  pPositions[i * 3 + 2] = r * Math.cos(phi);
  pVelocities.push({
    x: (Math.random() - 0.5) * 0.003,
    y: (Math.random() - 0.5) * 0.003,
    z: (Math.random() - 0.5) * 0.003,
  });
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
const pMat = new THREE.PointsMaterial({ color: 0x4fc3f7, size: 0.03, transparent: true, opacity: 0.6 });
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// Stato animazione
let brainState = 'idle'; // idle | thinking | speaking
let brainIntensity = 0;

function setBrainState(state) {
  brainState = state;
  if (state === 'thinking') {
    brainMat.emissive.setHex(0x0d3b6a);
    pointLight.color.setHex(0x4fc3f7);
    pMat.color.setHex(0x4fc3f7);
  } else if (state === 'speaking') {
    brainMat.emissive.setHex(0x1b5e20);
    pointLight.color.setHex(0x81c784);
    pMat.color.setHex(0x81c784);
  } else {
    brainMat.emissive.setHex(0x0d1b2a);
    pointLight.color.setHex(0x4fc3f7);
    pMat.color.setHex(0x4fc3f7);
  }
}

function onResize() {
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Rotazione lenta
  brain.rotation.y = t * 0.15;
  brain.rotation.x = Math.sin(t * 0.1) * 0.1;
  wireframe.rotation.y = t * 0.15;
  wireframe.rotation.x = Math.sin(t * 0.1) * 0.1;

  // Pulsazione in base allo stato
  const targetIntensity = brainState === 'idle' ? 0 : 1;
  brainIntensity += (targetIntensity - brainIntensity) * 0.05;
  const pulse = 1 + Math.sin(t * (brainState === 'thinking' ? 4 : 2)) * 0.02 * (1 + brainIntensity * 2);
  brain.scale.setScalar(pulse);
  wireframe.scale.setScalar(pulse * 1.01);

  // Particelle
  const pos = pGeo.attributes.position.array;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    pos[i * 3] += pVelocities[i].x * (1 + brainIntensity);
    pos[i * 3 + 1] += pVelocities[i].y * (1 + brainIntensity);
    pos[i * 3 + 2] += pVelocities[i].z * (1 + brainIntensity);
    const d = Math.sqrt(pos[i*3]**2 + pos[i*3+1]**2 + pos[i*3+2]**2);
    if (d > 2.0 || d < 1.1) {
      pVelocities[i].x *= -1;
      pVelocities[i].y *= -1;
      pVelocities[i].z *= -1;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
  pMat.opacity = 0.4 + brainIntensity * 0.4;

  wireMat.opacity = 0.05 + brainIntensity * 0.08;

  renderer.render(scene, camera);
}
animate();


// ======================================================================
// WEBSOCKET + UI
// ======================================================================
const chatArea = document.getElementById('chat-area');
const inputText = document.getElementById('input-text');
const btnSend = document.getElementById('btn-send');
const btnMic = document.getElementById('btn-mic');
const statusBar = document.getElementById('status-bar');

let ws = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let currentAudio = null;

function getWsUrl() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${proto}://${location.host}/ws`;
}

function connectWs() {
  statusBar.textContent = 'Connessione...';
  statusBar.className = '';
  ws = new WebSocket(getWsUrl());

  ws.onopen = () => {
    statusBar.textContent = 'Atlas online';
    statusBar.className = '';
    addMessage('bot', `Ciao! Sono Atlas. Dimmi qualcosa o premi il microfono per parlare.`);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'state') {
      if (msg.state === 'thinking') {
        statusBar.textContent = 'Sto pensando...';
        statusBar.className = 'thinking';
        setBrainState('thinking');
      } else if (msg.state === 'speaking') {
        statusBar.textContent = 'Rispondo...';
        statusBar.className = 'speaking';
        setBrainState('speaking');
      } else {
        statusBar.textContent = 'Atlas online';
        statusBar.className = '';
        setBrainState('idle');
      }
    }

    else if (msg.type === 'transcript') {
      addMessage('user', msg.text);
    }

    else if (msg.type === 'response') {
      addMessage('bot', msg.text);
      if (msg.audio) {
        playAudioB64(msg.audio);
      } else {
        setBrainState('idle');
        statusBar.textContent = 'Atlas online';
        statusBar.className = '';
      }
    }

    else if (msg.type === 'pong') {
      // keepalive ok
    }
  };

  ws.onclose = () => {
    statusBar.textContent = 'Disconnesso. Riconnessione...';
    statusBar.className = '';
    setBrainState('idle');
    setTimeout(connectWs, 3000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

// Keepalive (Render chiude connessioni inattive)
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 25000);

function addMessage(who, text) {
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function sendText(text) {
  if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) return;
  addMessage('user', text);
  ws.send(JSON.stringify({ type: 'text', text }));
  inputText.value = '';
}

// Invia testo
btnSend.addEventListener('click', () => sendText(inputText.value));
inputText.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendText(inputText.value);
});

// Audio playback
function playAudioB64(b64) {
  try {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    currentAudio = new Audio(url);
    currentAudio.onended = () => {
      setBrainState('idle');
      statusBar.textContent = 'Atlas online';
      statusBar.className = '';
      URL.revokeObjectURL(url);
      currentAudio = null;
    };
    currentAudio.play().catch(() => {
      setBrainState('idle');
      statusBar.textContent = 'Atlas online';
      statusBar.className = '';
    });
  } catch (err) {
    console.error('Audio playback error:', err);
    setBrainState('idle');
  }
}

// ======================================================================
// MICROFONO (MediaRecorder API — funziona su tutti i browser moderni)
// ======================================================================
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
    });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: getMimeType() });
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (audioChunks.length === 0) return;
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      // Converti in WAV per Whisper
      const wavBlob = await blobToWav(blob);
      const reader = new FileReader();
      reader.onloadend = () => {
        const b64 = reader.result.split(',')[1];
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'audio', data: b64 }));
        }
      };
      reader.readAsDataURL(wavBlob);
    };
    mediaRecorder.start();
    isRecording = true;
    btnMic.classList.add('recording');
    statusBar.textContent = 'Sto ascoltando...';
    statusBar.className = 'recording';
  } catch (err) {
    console.error('Mic error:', err);
    statusBar.textContent = 'Microfono non disponibile';
    setTimeout(() => { statusBar.textContent = 'Atlas online'; }, 2000);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
  isRecording = false;
  btnMic.classList.remove('recording');
  statusBar.textContent = 'Atlas online';
  statusBar.className = '';
}

function getMimeType() {
  if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) return 'audio/webm;codecs=opus';
  if (MediaRecorder.isTypeSupported('audio/webm')) return 'audio/webm';
  if (MediaRecorder.isTypeSupported('audio/mp4')) return 'audio/mp4';
  return '';
}

// Converti qualsiasi audio blob in WAV 16kHz mono (per Whisper)
async function blobToWav(blob) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const arrayBuffer = await blob.arrayBuffer();
  let audioBuffer;
  try {
    audioBuffer = await ctx.decodeAudioData(arrayBuffer);
  } catch (e) {
    // Se il decode fallisce, invia il blob originale
    ctx.close();
    return blob;
  }
  // Resample a 16kHz mono
  const offlineCtx = new OfflineAudioContext(1, audioBuffer.duration * 16000, 16000);
  const source = offlineCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(offlineCtx.destination);
  source.start();
  const rendered = await offlineCtx.startRendering();
  ctx.close();

  // Costruisci WAV
  const samples = rendered.getChannelData(0);
  const wavBuffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(wavBuffer);
  // Header WAV
  const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, 1, true); // mono
  view.setUint32(24, 16000, true); // sample rate
  view.setUint32(28, 32000, true); // byte rate
  view.setUint16(32, 2, true); // block align
  view.setUint16(34, 16, true); // bits per sample
  writeStr(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([wavBuffer], { type: 'audio/wav' });
}

// Mic: tap per registrare, tap di nuovo per fermare
btnMic.addEventListener('click', () => {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
});

// Stop audio corrente se l'utente clicca sul cervello
document.getElementById('brain-container').addEventListener('click', () => {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
    setBrainState('idle');
    statusBar.textContent = 'Atlas online';
    statusBar.className = '';
  }
});

// Avvia connessione
connectWs();
</script>
</body>
</html>
